# Databricks Asset Bundle definition for FinPay Lakehouse.
# This bundle separates DEV and PROD by catalog:
#   DEV  -> fintech_finpay_dev
#   PROD -> fintech_finpay

bundle:
  name: finpay_lakehouse
  uuid: 4f180677-2527-4d08-94ab-d5ca25c068c3

include:
  - resources/*.yml

# Files that must be deployed to the workspace under:
# /Workspace/Users/<user>/.bundle/finpay_lakehouse/<target>/files
sync:
  include:
    - notebooks/**
    - src/**
    - resources/**
    - dashboard/**
    - fixtures/**
    - README.md
    - pyproject.toml
  exclude:
    - .venv/**
    - .databricks/**
    - .git/**
    - __pycache__/**
    - "*.pyc"
    - ".DS_Store"

# Keep the wheel artifact only if your pyproject.toml is ready for package build.
# If `databricks bundle validate/deploy` fails because of `uv build --wheel`,
# temporarily comment this block until the source package is ready.
artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog used by the target environment

  schema:
    description: Default schema used by jobs/resources when required

  landing_volume:
    description: Landing volume name
    default: vol_landing

  warehouse_id:
    description: SQL Warehouse ID used by semantic/materialized view jobs
    default: ""

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-7c159ac5-3ffa.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev

    variables:
      catalog: fintech_finpay_dev
      schema: dev
      landing_volume: vol_landing

    permissions:
      - user_name: carlos.garciah@pucp.edu.pe
        level: CAN_MANAGE

  prod:
    mode: production

    workspace:
      host: https://dbc-7c159ac5-3ffa.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod

    variables:
      catalog: fintech_finpay
      schema: prod
      landing_volume: vol_landing

    permissions:
      - user_name: carlos.garciah@pucp.edu.pe
        level: CAN_MANAGE
