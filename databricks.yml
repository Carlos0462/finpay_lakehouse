# This is a Databricks asset bundle definition for finpay_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: finpay_lakehouse
  uuid: 4f180677-2527-4d08-94ab-d5ca25c068c3

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7c159ac5-3ffa.cloud.databricks.com
    variables:
      catalog: fintech_finpay
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-7c159ac5-3ffa.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/carlos.garciah@pucp.edu.pe to make sure we only have a single copy.
      root_path: /Workspace/Users/carlos.garciah@pucp.edu.pe/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: fintech_finpay
      schema: prod
    permissions:
      - user_name: carlos.garciah@pucp.edu.pe
        level: CAN_MANAGE
