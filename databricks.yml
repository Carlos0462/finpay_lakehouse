# Databricks Asset Bundle definition for FinPay Lakehouse.
# This bundle separates DEV and PROD by catalog:
#   DEV  -> fintech_finpay_dev
#   PROD -> fintech_finpay

bundle:
  name: finpay_lakehouse
  uuid: 4f180677-2527-4d08-94ab-d5ca25c068c3

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**
    - src/**
    - resources/**
    - dashboard/**
    - fixtures/**
    - README.md
    - pyproject.toml
  exclude:
    - .venv/**
    - .databricks/**
    - .git/**
    - __pycache__/**
    - "*.pyc"
    - ".DS_Store"

# Mantener comentado hasta que el pyproject.toml esté listo para construir wheel.
# artifacts:
#   python_artifact:
#     type: whl
#     build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog used by the target environment

  schema:
    description: Default schema used by jobs/resources when required

  landing_volume:
    description: Landing volume name
    default: vol_landing

  warehouse_id:
    description: SQL Warehouse ID used by semantic/materialized view jobs
    default: "c6cb83fa9d6d6137"

  notification_email:
    description: Email para alertas de fallo de jobs y pipelines
    default: carlos.garciah@pucp.edu.pe

  pipeline_development:
    description: Indica si el pipeline corre en modo desarrollo
    default: true

  cluster_policy_id:
    description: Cluster policy ID para jobs o pipelines cuando aplique
    default: ""

  observability_dashboard_file:
    description: Archivo .lvdash.json del dashboard de observabilidad según target
    default: ../dashboard/observability_dev.lvdash.json

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-7c159ac5-3ffa.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev

    variables:
      catalog: fintech_finpay_dev
      schema: default
      landing_volume: vol_landing
      warehouse_id: "c6cb83fa9d6d6137"
      notification_email: carlos.garciah@pucp.edu.pe
      pipeline_development: true
      cluster_policy_id: ""
      observability_dashboard_file: ../dashboard/observability_dev.lvdash.json

    permissions:
      - user_name: carlos.garciah@pucp.edu.pe
        level: CAN_MANAGE

  prod:
    mode: production

    workspace:
      host: https://dbc-7c159ac5-3ffa.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod

    variables:
      catalog: fintech_finpay
      schema: default
      landing_volume: vol_landing
      warehouse_id: "c6cb83fa9d6d6137"
      notification_email: carlos.garciah@pucp.edu.pe
      pipeline_development: false
      cluster_policy_id: ""
      observability_dashboard_file: ../dashboard/observability_prod.lvdash.json

    permissions:
      - user_name: carlos.garciah@pucp.edu.pe
        level: CAN_MANAGE
